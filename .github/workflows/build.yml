name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (Debian, dynamic, -Werror)
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:bookworm sh -c '
            set -ex
            apt-get update && apt-get install -y --no-install-recommends build-essential cmake pkgconf git \
              libcurl4-openssl-dev libjansson-dev libsodium-dev libmicrohttpd-dev
            git config --global --add safe.directory /src
            cmake -S . -B build-deb -DCMAKE_C_FLAGS="-Wall -Werror"
            cmake --build build-deb --parallel || { diff doc/example_datum_gateway_config.json build-deb/CMakeFiles/generated_example_datum_gateway_config.json; exit 1; }
            ./build-deb/datum_gateway --help >/dev/null
            ./build-deb/datum_gateway --test'

  static:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static build and self-test
        run: docker run --rm -v "$PWD:/src" -w /src alpine:3.20 sh packaging/build-static.sh
      - name: Package
        run: |
          NAME=miningmadness-datum-gateway-${GITHUB_REF_NAME//\//-}-linux-${{ matrix.arch }}
          mkdir -p "dist/$NAME"
          cp build-static/datum_gateway packaging/start.sh config.example.json LICENSE README.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [debian, static]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [debian]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
